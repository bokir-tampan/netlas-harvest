name: model-hunt

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages per dork"
        required: false
        default: "1"

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        dork:
          # upstream relay fingerprints that expose these model families
          - 'http.title:"New API" AND http.html:"register"'
          - 'http.title:"One API" AND http.html:"register"'
          - 'http.title:"Veloera" AND http.html:"register"'
          - 'http.title:"done-hub" AND http.html:"register"'
          - 'http.title:"VoAPI" AND http.html:"register"'
          - 'http.title:"SuperAPI" AND http.html:"register"'
          - 'http.title:"UniAPI" AND http.html:"register"'
          - 'http.title:"中转" AND http.html:"注册"'
          - 'http.title:"Xinference" AND whois.net.name:"Alibaba"'
          - 'http.title:"LocalAI" AND whois.net.name:"Alibaba"'
          - 'http.title:"vLLM" AND whois.net.name:"Alibaba"'
          - 'http.title:"LiteLLM" AND whois.net.name:"Alibaba"'
          - 'http.title:"Dify" AND whois.net.name:"Alibaba"'
          - 'http.title:"Ollama" AND whois.net.name:"Alibaba"'
          - 'http.title:"New API" AND whois.net.name:"Alibaba"'
          - 'http.title:"One API" AND whois.net.name:"Alibaba"'
          - 'http.title:"中转" AND whois.net.name:"Alibaba"'
          - 'http.title:"FastGPT" AND whois.net.name:"Alibaba"'
          - 'http.title:"MaxKB" AND whois.net.name:"Alibaba"'
          - 'http.title:"Chat Nio" AND whois.net.name:"Alibaba"'
          - 'http.title:"text-generation-webui" AND whois.net.name:"Alibaba"'
          - 'http.title:"ComfyUI" AND whois.net.name:"Alibaba"'
          - 'http.title:"AnythingLLM" AND whois.net.name:"Alibaba"'
          - 'http.title:"LobeChat" AND whois.net.name:"Alibaba"'
          - 'http.html:"v1/chat/completions" AND whois.net.name:"Alibaba"'
          - 'http.html:"v1/models" AND whois.net.name:"Alibaba"'
          - 'http.title:"推理" AND whois.net.name:"Alibaba"'
          - 'http.title:"模型" AND whois.net.name:"Alibaba"'
          - 'http.title:"API Gateway" AND whois.net.name:"Alibaba"'
          - 'http.title:"Xinference" AND whois.asn.name:"Alibaba"'
          - 'http.title:"vLLM" AND whois.asn.name:"Alibaba"'
          - 'http.title:"LocalAI" AND whois.asn.name:"Alibaba"'
          - 'http.title:"Dify" AND whois.asn.name:"Alibaba"'
          - 'http.title:"中转" AND whois.asn.name:"Alibaba"'
          - 'http.title:"LiteLLM" AND whois.asn.name:"Alibaba"'
          - 'http.title:"Ollama" AND whois.asn.name:"Alibaba"'
          - 'http.title:"New API" AND whois.asn.name:"Alibaba"'
          - 'http.title:"FastGPT" AND whois.asn.name:"Alibaba"'
    steps:
      - uses: actions/checkout@v4
      - name: Harvest
        env:
          DORK: ${{ matrix.dork }}
          PAGES: ${{ inputs.pages || '1' }}
          PROBE: "1"
        run: python3 harvest.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ job.number }}
          path: out.json
          if-no-files-found: warn
          retention-days: 7
