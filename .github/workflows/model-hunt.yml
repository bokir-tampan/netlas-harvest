name: model-hunt

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages per dork"
        required: false
        default: "1"

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        dork:
          # upstream relay fingerprints that expose these model families
          - 'http.title:"New API"'
          - 'http.title:"One API"'
          - 'http.title:"VoAPI"'
          - 'http.title:"Chat Nio"'
          - 'http.title:"FastGPT"'
          - 'http.title:"MaxKB"'
          - 'http.title:"Dify"'
          - 'http.title:"Open WebUI"'
          - 'http.title:"LobeChat"'
          - 'http.title:"LibreChat"'
          - 'http.title:"RagFlow"'
          - 'http.title:"Bisheng"'
          - 'http.title:"Xinference"'
          - 'http.title:"LocalAI"'
          - 'http.title:"vLLM"'
          - 'http.title:"LiteLLM"'
          - 'http.title:"Ollama"'
          - 'http.title:"NextChat"'
          - 'http.title:"AnythingLLM"'
          - 'http.html:"免费额度" AND http.status:200'
          - 'http.html:"注册送" AND http.status:200'
          - 'http.html:"免费试用" AND http.status:200'
          - 'http.html:"free credits" AND http.status:200'
          - 'http.html:"free tokens" AND http.status:200'
          - 'http.html:"free tier" AND http.html:"api key" AND http.status:200'
          - 'http.html:"register" AND http.html:"v1/chat/completions" AND http.status:200'
          - 'http.title:"API Gateway" AND http.html:"register"'
          - 'http.html:"signup" AND http.html:"quota" AND http.status:200'
          - 'http.title:"AI" AND http.html:"免费" AND http.html:"register" AND http.status:200'
          - 'http.html:"赠" AND http.html:"key" AND http.status:200'
    steps:
      - uses: actions/checkout@v4
      - name: Harvest
        env:
          DORK: ${{ matrix.dork }}
          PAGES: ${{ inputs.pages || '1' }}
          PROBE: "1"
        run: python3 harvest.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ job.number }}
          path: out.json
          if-no-files-found: warn
          retention-days: 7
