name: model-hunt

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages per dork"
        required: false
        default: "1"

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        dork:
          # upstream relay fingerprints that expose these model families
          - 'http.html:"Ollama is running" AND whois.net.name:"Alibaba"'
          - 'http.html:"Ollama is running" AND whois.asn.name:"Alibaba"'
          - 'http.html:"Ollama is running" AND geo.country:CN'
          - 'http.html:"Ollama is running" AND geo.country:US'
          - 'http.html:"Ollama is running" AND geo.country:DE'
          - 'http.html:"Ollama is running" AND geo.country:JP'
          - 'http.html:"Ollama is running" AND geo.country:SG'
          - 'http.html:"Ollama is running" AND geo.country:KR'
          - 'http.html:"Ollama is running" AND geo.country:IN'
          - 'http.html:"Ollama is running" AND geo.country:RU'
          - 'http.html:"Ollama is running" AND geo.country:BR'
          - 'http.html:"Ollama is running" AND geo.country:FR'
          - 'http.html:"Ollama is running" AND geo.country:GB'
          - 'http.html:"Ollama is running" AND geo.country:NL'
          - 'http.html:"Ollama is running" AND geo.country:CA'
          - 'http.html:"Ollama is running" AND geo.country:AU'
          - 'port:11434 AND whois.net.name:"Alibaba"'
          - 'port:11434 AND geo.country:CN'
          - 'port:11434 AND geo.country:US'
          - 'port:11434 AND geo.country:DE'
          - 'port:11434 AND geo.country:JP'
          - 'port:11434 AND geo.country:SG'
          - 'http.title:"Ollama" AND whois.net.name:"Alibaba"'
          - 'http.title:"Ollama" AND geo.country:CN'
          - 'http.title:"Ollama" AND geo.country:US'
          - 'http.title:"Ollama" AND geo.country:DE'
          - 'http.title:"Ollama" AND geo.country:JP'
          - 'http.title:"Ollama" AND geo.country:SG'
          - 'http.title:"Open WebUI" AND geo.country:CN'
          - 'http.title:"Open WebUI" AND whois.net.name:"Alibaba"'
    steps:
      - uses: actions/checkout@v4
      - name: Harvest
        env:
          DORK: ${{ matrix.dork }}
          PAGES: ${{ inputs.pages || '1' }}
          PROBE: "1"
        run: python3 harvest.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ job.number }}
          path: out.json
          if-no-files-found: warn
          retention-days: 7
