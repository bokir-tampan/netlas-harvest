name: model-hunt

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages per dork"
        required: false
        default: "1"

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        dork:
          # upstream relay fingerprints that expose these model families
          - 'http.title:"Veloera"'
          - 'http.title:"Done Hub"'
          - 'http.title:"GPT Load"'
          - 'http.title:"one-hub"'
          - 'http.title:"Super API"'
          - 'http.title:"Rix API"'
          - 'http.title:"Shell API"'
          - 'http.html:"Veloera" AND http.status:200'
          - 'http.html:"初始额度" AND http.status:200'
          - 'http.html:"赠送额度" AND http.status:200'
          - 'http.html:"注册送额度" AND http.status:200'
          - 'http.html:"新用户赠送" AND http.status:200'
          - 'http.html:"免费送" AND http.status:200'
          - 'http.html:"送额度" AND http.status:200'
          - 'http.html:"免费领" AND http.status:200'
          - 'http.html:"initial quota" AND http.status:200'
          - 'http.html:"free quota" AND http.status:200'
          - 'http.html:"free credits" AND http.html:"api key"'
          - 'http.html:"grant" AND http.html:"register" AND http.status:200'
          - 'port:3000 AND http.html:"chat/completions"'
          - 'port:8000 AND http.html:"register" AND http.status:200'
          - 'port:8080 AND http.html:"register" AND http.status:200'
          - 'http.html:"new-api" AND http.html:"register"'
          - 'http.html:"one-api" AND http.html:"register"'
          - 'http.html:"新注册用户"'
          - 'http.html:"充值" AND http.html:"register" AND http.status:200'
          - 'http.html:"邀请返利"'
          - 'http.html:"兑换码" AND http.status:200'
          - 'http.html:"签到" AND http.html:"quota"'
          - 'http.html:"额度" AND http.html:"api" AND http.html:"register" AND http.status:200'
    steps:
      - uses: actions/checkout@v4
      - name: Harvest
        env:
          DORK: ${{ matrix.dork }}
          PAGES: ${{ inputs.pages || '1' }}
          PROBE: "1"
        run: python3 harvest.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ job.number }}
          path: out.json
          if-no-files-found: warn
          retention-days: 7
