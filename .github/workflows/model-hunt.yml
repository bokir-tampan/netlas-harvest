name: model-hunt

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages per dork"
        required: false
        default: "1"

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        dork:
          # upstream relay fingerprints that expose these model families
          - 'http.title:"New API" AND http.html:"register"'
          - 'http.title:"One API" AND http.html:"register"'
          - 'http.title:"Veloera" AND http.html:"register"'
          - 'http.title:"done-hub" AND http.html:"register"'
          - 'http.title:"VoAPI" AND http.html:"register"'
          - 'http.title:"SuperAPI" AND http.html:"register"'
          - 'http.title:"UniAPI" AND http.html:"register"'
          - 'http.title:"中转" AND http.html:"注册"'
          - 'http.html:"免费" AND http.html:"API" AND http.html:"token"'
          - 'http.html:"free trial" AND http.html:"v1/models"'
          - 'http.html:"免费额度"'
          - 'http.html:"新用户" AND http.html:"API"'
          - 'http.html:"1M tokens"'
          - 'http.html:"million tokens" AND http.html:"free"'
          - 'http.title:"AI Gateway" AND http.html:"signup"'
          - 'http.html:"open registration" AND http.html:"api"'
          - 'http.title:"Relay" AND http.html:"注册"'
          - 'http.html:"额度" AND http.html:"v1/chat/completions"'
          - 'http.title:"Model List" AND http.html:"register"'
          - 'http.html:"register" AND http.html:"api key"'
    steps:
      - uses: actions/checkout@v4
      - name: Harvest
        env:
          DORK: ${{ matrix.dork }}
          PAGES: ${{ inputs.pages || '1' }}
          PROBE: "1"
        run: python3 harvest.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ job.number }}
          path: out.json
          if-no-files-found: warn
          retention-days: 7
