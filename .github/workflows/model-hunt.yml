name: model-hunt

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages per dork"
        required: false
        default: "1"

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        dork:
          # upstream relay fingerprints that expose these model families
          - 'http.title:"New API" AND http.html:"register"'
          - 'http.title:"One API" AND http.html:"register"'
          - 'http.title:"Veloera" AND http.html:"register"'
          - 'http.title:"done-hub" AND http.html:"register"'
          - 'http.title:"VoAPI" AND http.html:"register"'
          - 'http.title:"SuperAPI" AND http.html:"register"'
          - 'http.title:"UniAPI" AND http.html:"register"'
          - 'http.title:"中转" AND http.html:"注册"'
          - 'http.html:"step-3.7-flash"'
          - 'http.html:"step-3.5-flash"'
          - 'http.html:"nemotron-3-ultra"'
          - 'http.html:"nemotron-3-super"'
          - 'http.html:"nemotron-3.5-lightning"'
          - 'http.html:"north-mini-code"'
          - 'http.html:"laguna-xs-2.1"'
          - 'http.html:"laguna-s-2.1"'
          - 'http.html:"grok-4.6"'
          - 'http.html:"grok-4.7"'
          - 'http.html:"dots-3-note-preview"'
          - 'http.html:"big-pickle"'
          - 'http.html:"muse-spark-1.3"'
          - 'http.html:"muse-unrestricted"'
          - 'http.html:"ling-3.0-flash"'
          - 'http.html:"ling-3.1-flash"'
          - 'http.html:"mimo-v2.6-flash"'
          - 'http.html:"space-bunny"'
          - 'http.html:"longcat-2.5-preview"'
          - 'http.html:"apodex-1.1-mini"'
          - 'http.html:"jerouter"'
          - 'http.html:"cat-jam"'
          - 'http.html:"minimax-m2.7"'
          - 'http.html:"claude-haiku-5.5"'
          - 'http.html:"deepseek-v4-flash-0731"'
          - 'http.html:"step-5-preview"'
          - 'http.html:"sonnet-unrestricted"'
          - 'http.html:"deepseek-unrestricted"'
          - 'http.html:"step-5-unrestricted"'
          - 'http.html:"qwen3.8-omni-flash"'
    steps:
      - uses: actions/checkout@v4
      - name: Harvest
        env:
          DORK: ${{ matrix.dork }}
          PAGES: ${{ inputs.pages || '1' }}
          PROBE: "1"
        run: python3 harvest.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ job.number }}
          path: out.json
          if-no-files-found: warn
          retention-days: 7
