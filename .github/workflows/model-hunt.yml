name: model-hunt

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages per dork"
        required: false
        default: "1"

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        dork:
          # upstream relay fingerprints that expose these model families
          - 'http.title:"Open WebUI" AND whois.asn.name:"Alibaba"'
          - 'http.title:"Open WebUI" AND whois.asn.name:"Tencent"'
          - 'http.title:"Open WebUI" AND whois.asn.name:"Huawei"'
          - 'http.title:"Ollama" AND whois.asn.name:"Tencent"'
          - 'http.title:"Ollama" AND whois.asn.name:"Huawei"'
          - 'http.title:"Xinference" AND whois.asn.name:"Tencent"'
          - 'http.title:"Xinference" AND whois.asn.name:"Huawei"'
          - 'http.title:"vLLM" AND whois.asn.name:"Tencent"'
          - 'http.title:"vLLM" AND whois.asn.name:"Huawei"'
          - 'http.title:"Dify" AND whois.asn.name:"Tencent"'
          - 'http.title:"Dify" AND whois.asn.name:"Huawei"'
          - 'http.title:"LiteLLM" AND whois.asn.name:"Tencent"'
          - 'http.title:"LiteLLM" AND whois.asn.name:"Huawei"'
          - 'http.title:"New API" AND whois.asn.name:"Tencent"'
          - 'http.title:"One API" AND whois.asn.name:"Tencent"'
          - 'http.title:"中转" AND whois.asn.name:"Tencent"'
          - 'http.title:"中转" AND whois.asn.name:"Huawei"'
          - 'http.title:"模型" AND whois.asn.name:"Tencent"'
          - 'http.title:"模型" AND whois.asn.name:"Huawei"'
          - 'http.title:"LibreChat" AND whois.asn.name:"Alibaba"'
          - 'http.title:"NextChat" AND whois.asn.name:"Alibaba"'
          - 'http.title:"RagFlow" AND whois.asn.name:"Alibaba"'
          - 'http.title:"Bisheng" AND whois.asn.name:"Alibaba"'
          - 'http.title:"FastChat" AND whois.asn.name:"Alibaba"'
          - 'http.title:"Chat Nio" AND whois.asn.name:"Alibaba"'
          - 'http.title:"Chat Nio" AND whois.asn.name:"Tencent"'
          - 'http.title:"MaxKB" AND whois.asn.name:"Tencent"'
          - 'http.title:"FastGPT" AND whois.asn.name:"Tencent"'
          - 'http.title:"LobeChat" AND whois.asn.name:"Tencent"'
          - 'http.title:"LobeChat" AND whois.asn.name:"Alibaba"'
    steps:
      - uses: actions/checkout@v4
      - name: Harvest
        env:
          DORK: ${{ matrix.dork }}
          PAGES: ${{ inputs.pages || '1' }}
          PROBE: "1"
        run: python3 harvest.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ job.number }}
          path: out.json
          if-no-files-found: warn
          retention-days: 7
