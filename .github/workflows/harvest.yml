name: netlas-harvest

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages per dork"
        required: false
        default: "3"
      probe:
        description: "Probe /v1/models on discovered hosts (1/0)"
        required: false
        default: "1"
  push:
    branches: [main]
    paths: ["trigger.txt"]

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dork:
          - 'http.title:"New API"'
          - 'http.title:"One API"'
          - 'http.title:"LiteLLM"'
          - 'http.title:"Open WebUI"'
          - 'http.title:"Ollama is running"'
          - 'http.title:"LocalAI"'
          - 'http.title:"text-generation-webui"'
          - 'http.title:"LobeChat"'
          - 'http.title:"ChatGPT-Next-Web"'
          - 'http.title:"vLLM"'
          - 'http.title:"FastChat"'
          - 'http.title:"KoboldAI"'
          - 'http.title:"koboldcpp"'
          - 'http.title:"LM Studio"'
          - 'http.title:"AnythingLLM"'
          - 'http.title:"LibreChat"'
          - 'http.title:"Big-AGI"'
          - 'http.title:"TypingMind"'
          - 'http.html:"llama.cpp server"'
          - 'http.html:"api.deepseek.com" AND http.html:"chat/completions"'
          - 'http.title:"中转"'
          - 'http.title:"Veloera"'
          - 'http.title:"done-hub"'
          - 'http.title:"SuperAPI"'
          - 'http.title:"UniAPI"'
          - 'http.title:"VoAPI"'
          - 'http.title:"AI Gateway"'
          - 'http.html:"v1/messages" AND http.html:"anthropic"'
          - 'http.title:"Copilot" AND http.html:"v1"'
          - 'http.title:"Qwen" AND port:8000'
          - 'http.title:"gpt4free"'
          - 'http.title:"Dify"'
          - 'http.title:"SiliconFlow"'
          - 'http.title:"OpenAI-compatible API"'
          - 'http.title:"API Gateway"'
          - 'http.title:"LLM API"'
          - 'http.html:"chat/completions" AND http.html:"stream"'
          - 'http.html:"choices":[{"message"'
          - 'http.html:"openai" AND http.html:"v1/models"'
          - 'http.title:"chat" AND port:5000'
          - 'http.title:"gpt" AND port:8000'
          - 'http.html:"sk-" AND http.html:"api/v1"'
          - 'http.title:"Model List" OR http.title:"模型列表"'
          - 'http.title:"API 文档" OR http.title:"API Docs"'
    steps:
      - uses: actions/checkout@v4

      - name: Harvest
        env:
          DORK: ${{ matrix.dork }}
          PAGES: ${{ inputs.pages || '3' }}
          PROBE: ${{ inputs.probe || '1' }}
        run: python3 harvest.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ job.number }}
          path: out.json
          if-no-files-found: warn
          retention-days: 7
