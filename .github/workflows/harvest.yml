name: netlas-harvest

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages per dork"
        required: false
        default: "6"
      probe:
        description: "Probe /v1/models on discovered hosts (1/0)"
        required: false
        default: "1"
  push:
    branches: [main]
    paths: ["trigger.txt"]

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dork:
          - 'http.title:"Xinference" AND country:CN'
          - 'http.title:"Xinference" AND country:US'
          - 'http.title:"Xinference" AND country:JP'
          - 'http.title:"Xinference" AND country:SG'
          - 'http.title:"Xinference" AND country:HK'
          - 'http.title:"Xinference" AND country:KR'
          - 'http.title:"Xinference" AND country:TW'
          - 'http.title:"Xinference" AND country:DE'
          - 'http.title:"LocalAI" AND country:US'
          - 'http.title:"LocalAI" AND country:DE'
          - 'http.title:"LocalAI" AND country:NL'
          - 'http.title:"LocalAI" AND country:FR'
          - 'http.title:"LocalAI" AND country:GB'
          - 'http.title:"vLLM" AND country:CN'
          - 'http.title:"vLLM" AND country:US'
          - 'http.title:"vLLM" AND country:JP'
          - 'http.title:"vLLM" AND country:SG'
          - 'http.title:"Ollama" AND country:US'
          - 'http.title:"Ollama" AND country:DE'
          - 'http.title:"Ollama" AND country:BR'
          - 'http.title:"LiteLLM" AND country:US'
          - 'http.title:"LiteLLM" AND country:GB'
          - 'http.title:"LiteLLM" AND country:SG'
          - 'http.title:"Dify" AND country:CN'
          - 'http.title:"Dify" AND country:US'
          - 'http.title:"中转" AND country:CN'
          - 'http.title:"FastGPT" AND country:CN'
          - 'http.title:"MaxKB" AND country:CN'
          - 'http.title:"Chat Nio" AND country:CN'
    steps:
      - uses: actions/checkout@v4

      - name: Harvest
        env:
          DORK: ${{ matrix.dork }}
          PAGES: ${{ inputs.pages || '6' }}
          PROBE: ${{ inputs.probe || '1' }}
        run: python3 harvest.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ job.number }}
          path: out.json
          if-no-files-found: warn
          retention-days: 7
