name: netlas-harvest

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages per dork"
        required: false
        default: "3"
      probe:
        description: "Probe /v1/models on discovered hosts (1/0)"
        required: false
        default: "1"
  push:
    branches: [main]
    paths: ["trigger.txt"]

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dork:
          - 'http.title:"New API"'
          - 'http.title:"One API"'
          - 'http.title:"LiteLLM"'
          - 'http.title:"Open WebUI"'
          - 'http.title:"Ollama is running"'
          - 'http.title:"LocalAI"'
          - 'http.title:"text-generation-webui"'
          - 'http.title:"LobeChat"'
          - 'http.title:"ChatGPT-Next-Web"'
          - 'http.title:"vLLM"'
          - 'http.title:"FastChat"'
          - 'http.title:"KoboldAI"'
          - 'http.title:"ComfyUI"'
          - 'http.html:"v1/chat/completions"'
          - 'http.html:"v1/models"'
          - 'port:11434 AND http.html:"api/tags"'
          - 'port:8000 AND http.html:"v1/models"'
          - 'port:1234 AND http.html:"v1/models"'
          - 'port:8080 AND http.html:"v1/chat/completions"'
          - 'port:3000 AND http.html:"v1/models"'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harvest
        env:
          DORK: ${{ matrix.dork }}
          PAGES: ${{ inputs.pages || '3' }}
          PROBE: ${{ inputs.probe || '1' }}
        run: python3 harvest.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ strategy.job-index }}
          path: out.json
          if-no-files-found: warn
          retention-days: 7
