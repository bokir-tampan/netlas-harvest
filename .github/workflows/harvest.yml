name: netlas-harvest

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages per dork"
        required: false
        default: "6"
      probe:
        description: "Probe /v1/models on discovered hosts (1/0)"
        required: false
        default: "1"
  push:
    branches: [main]
    paths: ["trigger.txt"]

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dork:
          - 'http.title:"New API"'
          - 'http.title:"One API"'
          - 'http.title:"LocalAI"'
          - 'http.title:"vLLM"'
          - 'http.title:"LiteLLM"'
          - 'http.title:"Dify"'
          - 'http.title:"中转"'
          - 'http.title:"text-generation-inference"'
          - 'http.title:"Triton Inference Server"'
          - 'http.title:"FastGPT"'
          - 'http.title:"MaxKB"'
          - 'http.title:"Chat Nio"'
          - 'http.title:"NextChat"'
          - 'http.title:"PrivateGPT"'
          - 'http.title:"SillyTavern"'
          - 'http.title:"Ollama"'
          - 'http.title:"OpenLLM"'
          - 'http.title:"BentoML"'
          - 'http.title:"Xinference"'
          - 'http.title:"LLaMA-Factory"'
          - 'http.title:"Qwen"'
          - 'http.title:"DeepSeek"'
          - 'http.title:"inference" AND port:8000'
          - 'http.title:"推理"'
          - 'http.title:"模型"'
          - 'http.title:"OpenRouter"'
          - 'http.title:"Groq"'
          - 'http.title:"Together AI"'
          - 'http.title:"GGUF"'
          - 'http.title:"LM Studio"'
    steps:
      - uses: actions/checkout@v4

      - name: Harvest
        env:
          DORK: ${{ matrix.dork }}
          PAGES: ${{ inputs.pages || '6' }}
          PROBE: ${{ inputs.probe || '1' }}
        run: python3 harvest.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ job.number }}
          path: out.json
          if-no-files-found: warn
          retention-days: 7
